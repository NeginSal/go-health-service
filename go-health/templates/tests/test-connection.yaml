apiVersion: v1
kind: Pod

metadata:
  name: "{{ include "go-health.fullname" . }}-test-connection"

  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "--spider"
        - "-q"
        - "http://{{ include "go-health.fullname" . }}:{{ .Values.service.port }}/health"

  restartPolicy: Never