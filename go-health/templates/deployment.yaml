apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "go-health.fullname" . }}
  labels:
    {{- include "go-health.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "go-health.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "go-health.labels" . | nindent 8 }}

    spec:
      containers:
        - name: go-health
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: go-health-secret
                  key: API_TOKEN

          envFrom:
            - configMapRef:
                name: {{ include "go-health.fullname" . }}-config 

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

