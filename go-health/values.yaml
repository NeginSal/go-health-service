replicaCount: 1

image:
  repository: go-health-service
  tag: "v4"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  appEnv: "production"
  logLevel: "info"